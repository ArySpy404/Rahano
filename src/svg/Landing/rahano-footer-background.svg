<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ff"/>
      <stop offset="0.5" stop-color="#faf9ff"/>
      <stop offset="1" stop-color="#f1efff"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e5ff"/>
      <stop offset="1" stop-color="#c9c4fa"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd9ff"/>
      <stop offset="1" stop-color="#bdb7f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="28" fill="url(#bg)"/>

  <!-- left winding decorative trail -->
  <path d="M35 218 C80 185 145 204 158 165 C171 127 120 132 125 101 C130 72 170 70 195 89"
        fill="none" stroke="#c9c4ff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M35 218 C80 185 145 204 158 165"
        fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".45"/>

  <!-- left sparkles -->
  <g fill="#9cff22">
    <path d="M177 43 l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
    <path d="M112 115 l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
  </g>
  <path d="M72 84 l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#5632ef"/>
  <path d="M207 39 l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#fff" stroke="#5a42ef" stroke-width="1.5"/>

  <!-- mountains -->
  <path d="M675 215 L750 105 L820 151 L890 72 L1045 188 L1110 126 L1200 183 L1200 220 Z"
        fill="url(#mountain)"/>
  <path d="M675 215 L750 105 L820 151 L750 173 Z" fill="#aaa3ef" opacity=".75"/>
  <path d="M1110 126 L1200 183 L1200 220 L1152 191 Z" fill="#aaa3ef" opacity=".7"/>

  <!-- snow caps -->
  <path d="M750 105 L733 130 Q749 140 765 126 L779 145 L800 134 L820 151 L788 132 L774 116 L761 121 Z"
        fill="#fff" opacity=".95"/>
  <path d="M1110 126 L1096 145 Q1110 153 1126 143 L1140 155 L1156 146 L1170 157 L1152 137 L1138 128 Z"
        fill="#fff" opacity=".95"/>

  <!-- summit flag -->
  <path d="M1027 64 L1027 113" stroke="#202044" stroke-width="4" stroke-linecap="round"/>
  <path d="M1028 65 Q1054 58 1082 68 L1068 80 L1082 88 Q1053 93 1028 83 Z"
        fill="#5b36ef"/>

  <!-- mountain route -->
  <path d="M835 220 C865 188 930 201 974 184 C1014 168 1000 146 974 132 C951 120 971 104 1001 95"
        fill="none" stroke="#b8b1f8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- upper decorative streaks -->
  <path d="M855 58 l18-24" stroke="#c9c3ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M855 58 l7-10" stroke="#caff31" stroke-width="3" stroke-linecap="round"/>
  <path d="M1110 44 l20-23" stroke="#d2ceff" stroke-width="3" stroke-linecap="round"/>
  <path d="M1110 44 l8-10" stroke="#caff31" stroke-width="3" stroke-linecap="round"/>

  <!-- clouds -->
  <path d="M1080 38 q8-12 20-5 q10-17 25 0 q15-4 22 7 q-31 8-67 3z"
        fill="#fff" opacity=".8"/>

  <!-- tiny stars -->
  <g fill="#caff31">
    <path d="M1047 92 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M1165 105 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
  </g>
</svg>