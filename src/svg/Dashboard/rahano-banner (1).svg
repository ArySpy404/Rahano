<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 203" width="1408" height="203" role="img" aria-label="بنر فضایی رهانو"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120E33"/>
      <stop offset="0.55" stop-color="#2A1F6B"/>
      <stop offset="1" stop-color="#4330A0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9A88E8"/>
      <stop offset="0.6" stop-color="#6552C4"/>
      <stop offset="1" stop-color="#3A2A8A"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E4DCFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E78E0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4A38A8" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="0.4" cy="0.5" r="0.8">
      <stop offset="0.5" stop-color="#05031A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05031A" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1408" height="203" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1408" height="203" fill="url(#bg)"/>

    <!-- soft light patches -->
    <ellipse cx="200" cy="190" rx="260" ry="70" fill="#C45CC0" opacity="0.14" filter="url(#soft)"/>
    <ellipse cx="1150" cy="20" rx="300" ry="60" fill="#6A55D0" opacity="0.18" filter="url(#soft)"/>

    <!-- vignette -->
    <rect width="1408" height="203" fill="url(#vig)"/>

    <!-- stars -->
    <g fill="#FFFFFF" filter="url(#glow)">
      <circle cx="60" cy="40" r="1.6" opacity="0.8"/>
      <circle cx="143" cy="46" r="2.2"/>
      <circle cx="262" cy="22" r="1.4" opacity="0.7"/>
      <circle cx="605" cy="14" r="1.8"/>
      <circle cx="605" cy="121" r="2.2"/>
      <circle cx="760" cy="38" r="1.4" opacity="0.7"/>
      <circle cx="830" cy="150" r="1.6" opacity="0.8"/>
      <circle cx="935" cy="90" r="1.4" opacity="0.6"/>
      <circle cx="1010" cy="180" r="1.6" opacity="0.7"/>
      <circle cx="1090" cy="30" r="1.6" opacity="0.7"/>
      <circle cx="400" cy="30" r="1.2" opacity="0.6"/>
      <circle cx="330" cy="160" r="1.4" opacity="0.6"/>
    </g>
    <!-- four-point stars -->
    <g fill="#FFFFFF" filter="url(#glow)">
      <path d="M143 38 L145 44 L151 46 L145 48 L143 54 L141 48 L135 46 L141 44 Z"/>
      <path d="M605 112 L607 119 L614 121 L607 123 L605 130 L603 123 L596 121 L603 119 Z" opacity="0.9"/>
    </g>

    <!-- moon -->
    <g>
      <circle cx="470" cy="112" r="128" fill="url(#moon)" opacity="0.92"/>
      <g fill="#2A1F6B" opacity="0.4">
        <circle cx="420" cy="70" r="26"/>
        <circle cx="500" cy="150" r="34"/>
        <circle cx="455" cy="120" r="12"/>
        <circle cx="545" cy="75" r="14"/>
        <circle cx="395" cy="150" r="10"/>
      </g>
      <circle cx="470" cy="112" r="128" fill="none" stroke="#DCD2FF" stroke-opacity="0.35" stroke-width="2"/>
    </g>

    <!-- ring -->
    <g transform="rotate(-14 520 105)">
      <ellipse cx="520" cy="105" rx="330" ry="52" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
      <ellipse cx="520" cy="105" rx="300" ry="44" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- clouds -->
    <g fill="url(#cloud)" filter="url(#soft)">
      <ellipse cx="760" cy="196" rx="90" ry="22"/>
      <ellipse cx="840" cy="182" rx="70" ry="26"/>
      <ellipse cx="920" cy="198" rx="100" ry="22"/>
      <ellipse cx="40" cy="150" rx="70" ry="30" opacity="0.8"/>
      <ellipse cx="110" cy="185" rx="110" ry="26" opacity="0.8"/>
    </g>
  </g>
</svg>
