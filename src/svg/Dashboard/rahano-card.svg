  <rect x="55" y="52" width="54" height="12" rx="6" fill="#9A82EC"/>
  <rect x="55" y="52" width="54" height="5" rx="2.5" fill="#B3A0F5" opacity=".6"/>

  <!-- text -->
  <g font-family="Vazirmatn, Tahoma, 'Noto Sans Arabic', sans-serif" font-weight="800" font-size="15" fill="#1F1B4D" text-anchor="middle">
    <text x="82.5" y="128">با رهانو،</text>
