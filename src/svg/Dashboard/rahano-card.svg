  <path d="M82 40 C70 40 60 32 58 20 C71 19 81 26 82 40 Z" fill="#5BBF74"/>
  <path d="M82 36 C84 24 94 16 106 17 C106 29 96 38 82 36 Z" fill="#3FA862"/>

