<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 200" width="330" height="400" direction="rtl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F4FE"/>
      <stop offset="1" stop-color="#ECE9FA"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E73E6"/>
      <stop offset="1" stop-color="#7656D4"/>
    </linearGradient>
  </defs>

  <!-- card background -->
  <rect width="165" height="200" rx="14" fill="url(#bg)"/>
  <path d="M0 100 Q82 88 165 100 V186 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 Z" fill="#E7E3F7"/>

  <!-- plant -->
