<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#100A2D"/>
      <stop offset=".52" stop-color="#21104F"/>
      <stop offset="1" stop-color="#6334B4"/>
    </linearGradient>
    <linearGradient id="haze" x1="800" y1="220" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B3DC0" stop-opacity="0"/>
